<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="ks-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
  </defs>
  <!-- Emerald Green Rounded Badge matching KisanSetu Logo -->
  <rect width="64" height="64" rx="16" fill="url(#ks-gradient)" />
  <!-- Bold White 'KS' Branding -->
  <text 
    x="50%" 
    y="53.5%" 
    text-anchor="middle" 
    dominant-baseline="middle" 
    fill="#ffffff" 
    font-family="Inter, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" 
    font-weight="900" 
    font-size="33" 
    letter-spacing="-1px"
  >KS</text>
